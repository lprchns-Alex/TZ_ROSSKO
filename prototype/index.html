<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROSSKO — оформление заказа (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Токены сняты с rossko.ru (Розница) */
:root {
  --red: #ED2D2F;
  --red-press: #D42528;
  --red-soft: #FDECEC;
  --ink: #242424;
  --muted: #727688;
  --card: #EEEEF0;
  --paper: #FFFFFF;
  --line: #DEDEE3;
  --green: #3DB378;
  --green-ink: #1F8A55;
  --green-soft: #E6F5ED;
  --orange: #FF881A;
  --stage: #E2E4E8;
  --font: "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Сцена: телефон + панель сценариев */
.stage { min-height: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 40px; padding: 32px 24px; }
.phone {
  width: 390px; height: 844px; flex-shrink: 0;
  background: var(--paper);
  border-radius: 48px;
  box-shadow: 0 0 0 10px #18181a, 0 30px 80px rgba(24, 24, 26, .25);
  overflow: hidden; position: relative;
  display: flex; flex-direction: column;
}
.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.panel { width: 280px; position: sticky; top: 32px; background: var(--paper); border-radius: 20px; padding: 20px; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-size: 16px; }
.panel p { margin: 0; font-size: 13px; color: var(--muted); }
.panel .jump { display: grid; gap: 6px; }
.panel .jump button { text-align: left; border: 0; background: var(--card); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
.panel .jump button.cur { background: var(--red); color: #fff; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--red); }

@media (max-width: 760px) {
  .stage { display: block; padding: 0; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  .panel { position: static; width: auto; margin: 16px; }
}

/* Шапка */
.hdr {
  background: var(--red); color: #fff; flex-shrink: 0;
  border-radius: 0 0 28px 28px;
  padding: 50px 16px 18px;
  display: grid; gap: 12px;
}
@media (max-width: 760px) { .hdr { padding-top: calc(16px + env(safe-area-inset-top, 0px)); } }
.hdr-row { display: flex; align-items: center; gap: 12px; }
.hdr-title { font-size: 20px; font-weight: 700; line-height: 1.2; }
.hdr-sub { font-size: 13px; opacity: .85; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.logo { height: 26px; width: auto; display: block; }

/* Контент */
.content { padding: 16px; display: grid; gap: 12px; }
.block { background: var(--card); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.block-title { font-size: 18px; font-weight: 700; line-height: 1.25; }
.block-sub { font-size: 13px; color: var(--muted); margin-top: -8px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.strong { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.ok { color: var(--green-ink); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.white { background: var(--paper); border-radius: 16px; padding: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 40px; padding: 0 16px; border-radius: 100px; border: 0; background: var(--paper); font-weight: 500; cursor: pointer; }
.chip.sel { background: var(--red); color: #fff; }
.chips.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.chips.seg { gap: 6px; }
.chips.seg .chip { padding: 0 4px; font-size: 13px; white-space: nowrap; }
.day { font-size: 13px; color: var(--muted); margin-bottom: -4px; }

.link { background: none; border: 0; padding: 0; color: var(--red); font-weight: 500; cursor: pointer; text-align: left; }

/* Карточки выбора курьера */
.rcard {
  display: grid; grid-template-columns: 40px 1fr 22px; gap: 12px; align-items: start;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--paper); border: 2px solid transparent; border-radius: 16px; padding: 14px;
}
.rcard.sel { border-color: var(--red); }
.rcard-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--red-soft); color: var(--red); display: grid; place-items: center; }
.rcard-body { display: grid; gap: 4px; min-width: 0; }
.rcard-title { font-size: 16px; font-weight: 700; }
.rcard-desc { font-size: 14px; color: var(--muted); }
.rcard-hint { font-size: 13px; color: var(--green-ink); background: var(--green-soft); border-radius: 8px; padding: 6px 8px; display: flex; gap: 6px; align-items: flex-start; margin-top: 2px; }
.rcard-hint svg { flex-shrink: 0; margin-top: 1px; }
.rcard-eta { font-size: 14px; font-weight: 600; margin-top: 2px; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #C3C3C8; margin-top: 2px; }
.rcard.sel .radio { border-color: var(--red); background: var(--red); box-shadow: inset 0 0 0 4px #fff; }

.note { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.note svg { flex-shrink: 0; margin-top: 1px; }

/* Товары */
.item { display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
.thumb { width: 64px; height: 64px; border-radius: 14px; background: var(--paper); display: grid; place-items: center; color: #B4B4BC; }
.item-name { font-weight: 600; }
.price { font-weight: 700; font-size: 16px; }

.sum-row { display: flex; justify-content: space-between; font-size: 15px; }
.sum-total { font-size: 18px; font-weight: 700; }

/* Нижняя панель */
.bottom { flex-shrink: 0; background: var(--paper); padding: 12px 16px 30px; box-shadow: 0 -6px 20px rgba(36,36,36,.08); display: grid; gap: 8px; }
@media (max-width: 760px) { .bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); } }
.btn { height: 48px; border-radius: 100px; border: 0; background: var(--red); color: #fff; font-weight: 600; font-size: 16px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { background: var(--red-press); }
.btn.ghost { background: var(--card); color: var(--ink); }
.btn[disabled] { background: #C9C9CF; cursor: default; }

/* Шит */
.overlay { position: absolute; inset: 0; background: rgba(24,24,26,.45); display: flex; align-items: flex-end; z-index: 5; }
.sheet { background: var(--paper); border-radius: 28px 28px 0 0; width: 100%; max-height: 88%; overflow-y: auto; padding: 8px 16px 30px; display: grid; gap: 14px; }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: #D5D5DA; margin: 4px auto; }
.sheet h3 { margin: 0; font-size: 20px; }
.fmt { display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.fmt ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.fmt p { margin: 4px 0 0; font-size: 14px; }

/* Успех, трекинг */
.hero { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 8px 0; }
.big-check { width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
.hero h2 { margin: 0; font-size: 22px; }
.kv { display: grid; gap: 10px; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; }
.kv dt, .kv .k { color: var(--muted); }
.kv .v { font-weight: 600; text-align: right; }

.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 24px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.step::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: #D5D5DA; }
.step:last-child { padding-bottom: 0; }
.step:last-child::before { display: none; }
.dot { width: 24px; height: 24px; border-radius: 50%; background: #D5D5DA; display: grid; place-items: center; color: #fff; }
.step.done .dot { background: var(--green); }
.step.done::before { background: var(--green); }
.step.now .dot { background: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
.step.now .step-t { font-weight: 700; }

.reveal { background: var(--paper); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; border: 2px solid var(--red); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--red); }

.map { height: 150px; border-radius: 16px; overflow: hidden; background: #E9EAED; }
.map svg { width: 100%; height: 100%; display: block; }

.code { font-size: 28px; font-weight: 700; letter-spacing: .2em; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.check-list li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
.cdot { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
.cdot.off { background: #D5D5DA; }

.stars { display: flex; gap: 6px; justify-content: center; }
.star { border: 0; background: none; padding: 2px; cursor: pointer; color: #D5D5DA; }
.star.on { color: var(--orange); }
.chip.tag { height: 36px; font-size: 14px; }
.chip.tag.sel { background: var(--ink); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone"></div>

  <aside class="panel" aria-label="Сценарии прототипа">
    <h2>Прототип · сценарии</h2>
    <p>Кликабельный прототип оформления заказа с выбором курьера. Данные вымышлены.</p>
    <label class="switch"><input type="checkbox" id="biz" data-action="business"> Бизнес-аккаунт (СТО)</label>
    <div class="jump" id="jump"></div>
    <button class="btn ghost" data-action="reset">Сбросить</button>
  </aside>
</div>

<script>
const ICONS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  close: '<path d="M18 6L6 18M6 6l12 12"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  bolt: '<path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/>',
  smart: '<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  gift: '<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8.5h14V12M12 8v12.5"/><path d="M12 8C10.5 4.5 7 4.5 7 6.5S10 8 12 8zM12 8c1.5-3.5 5-3.5 5-1.5S14 8 12 8z"/>',
  car: '<path d="M5 16.5V12l1.8-4.6A2 2 0 018.7 6h6.6a2 2 0 011.9 1.4L19 12v4.5"/><path d="M3.5 12h17v4.5h-17z"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/>',
  chat: '<path d="M4 5h16v11H9l-5 4V5z"/>',
  phone: '<path d="M6.5 3.5l3 .5 1.5 4-2 1.5a11 11 0 005.5 5.5l1.5-2 4 1.5.5 3c0 1-1 2-2 2C10 19.5 4.5 14 4.5 5.5c0-1 1-2 2-2z"/>',
  part: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/>',
  oil: '<path d="M7 7h7l3 3v10H7z"/><path d="M9 7V4h3v3"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  back2: '<path d="M4 12a8 8 0 108-8 8 8 0 00-6.3 3"/><path d="M4 4v4h4"/>',
};
function ic(name, size = 20, fill = false) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}

const CAR = { name: 'Kia Rio IV', year: 2019, vin: 'Z94C•••••••4821' };
const CART = [
  { name: 'Колодки тормозные передние', sku: 'Арт. RK-24117', price: 3290, icon: 'part' },
  { name: 'Масло моторное 5W-30, 4 л', sku: 'Арт. RK-50431', price: 4190, icon: 'oil' },
];
const TOTAL = CART.reduce((s, i) => s + i.price, 0);
const COURIERS = {
  fast: {
    title: 'Побыстрее', icon: 'bolt',
    desc: 'Курьер, который успеет к ближайшему времени',
    slots: [['Сегодня', '14:00–15:00'], ['Сегодня', '15:00–16:00'], ['Сегодня', '16:00–17:00'], ['Сегодня', '18:00–19:00']],
  },
  smart: {
    title: 'Умный', icon: 'smart',
    desc: 'Сверит детали с вашим авто по VIN, проверит маркировку, сразу заберёт, если не подошли',
    hint: 'В заказе колодки и масло — сверит колодки по VIN и проверит допуск масла',
    slots: [['Сегодня', '16:00–18:00'], ['Сегодня', '18:00–20:00'], ['Завтра', '10:00–12:00']],
  },
  pretty: {
    title: 'Красивый', icon: 'gift',
    desc: 'Фирменная форма, аккуратная упаковка, вручит как подарок',
    slots: [['Завтра', '12:00–14:00'], ['Завтра', '14:00–16:00'], ['Завтра', '16:00–18:00']],
  },
};
const SCREENS = [
  ['cart', 'Корзина'], ['checkout', 'Оформление'], ['info', 'Шит «Что входит»'], ['success', 'Заказ оформлен'],
  ['tracking', 'Трекинг'], ['handover', 'Вручение'], ['returned', 'Деталь не подошла'], ['rating', 'Оценка'],
];
const BACK = { checkout: 'cart', success: 'cart', tracking: 'success', handover: 'tracking', returned: 'handover', rating: 'handover', done: 'cart' };

const initial = () => ({ screen: 'cart', method: 'courier', recipient: 'me', gift: false, courier: 'fast', expanded: false, business: false, slot: 0, pay: 'card', sheet: null, rating: 0, tags: [] });
let state = initial();

const rub = n => n.toLocaleString('ru-RU') + ' ₽';
const assigned = () => (state.courier === 'fast' ? 'smart' : state.courier);
const slot = () => { const s = COURIERS[state.courier].slots[state.slot] || COURIERS[state.courier].slots[0]; return s; };
const slotText = () => { const [d, t] = slot(); return `${d.toLowerCase()} ${t}`; };

/* ---------- части ---------- */
function header(title, sub, { back = true, logo = false } = {}) {
  return `<header class="hdr">
    ${logo ? `<img class="logo" src="assets/logo-ret.svg" alt="ROSSKO Розница">` : ''}
    <div class="hdr-row">
      ${back ? `<button class="icon-btn" data-action="back" aria-label="Назад">${ic('back')}</button>` : ''}
      <div><div class="hdr-title">${title}</div>${sub ? `<div class="hdr-sub">${sub}</div>` : ''}</div>
    </div>
  </header>`;
}
const block = (title, body, sub = '') => `<section class="block"><div class="block-title">${title}</div>${sub ? `<div class="block-sub">${sub}</div>` : ''}${body}</section>`;
const chips = (action, opts, cur, cls = '') => `<div class="chips ${cls}">${opts.map(([v, l]) => `<button class="chip ${v === cur ? 'sel' : ''}" data-action="${action}" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</div>`;

function rcard(k) {
  const c = COURIERS[k];
  const sel = state.courier === k;
  const [d, t] = c.slots[0];
  let hint = c.hint || '';
  if (k === 'pretty' && state.gift) hint = 'Это подарок — вручит красиво';
  return `<button class="rcard ${sel ? 'sel' : ''}" data-action="courier" data-v="${k}" aria-pressed="${sel}">
    <span class="rcard-ic">${ic(c.icon)}</span>
    <span class="rcard-body">
      <span class="rcard-title">${c.title}</span>
      <span class="rcard-desc">${c.desc}</span>
      ${hint ? `<span class="rcard-hint">${ic(k === 'pretty' ? 'gift' : 'car', 16)}<span>${hint}</span></span>` : ''}
      <span class="rcard-eta">${d.toLowerCase()} ${t}</span>
    </span>
    <span class="radio"></span>
  </button>`;
}

function courierBlock() {
  if (state.business && !state.expanded) {
    return block('Кто привезёт', `
      <div class="white row-between"><div><div class="strong">${ic('bolt', 16)} Побыстрее</div><div class="small muted">${slotText()}</div></div></div>
      <button class="link" data-action="expand">Выбрать формат курьера</button>`,
      'Для бизнес-аккаунта — самый быстрый вариант');
  }
  return block('Кто привезёт',
    ['fast', 'smart', 'pretty'].map(rcard).join('') +
    `<button class="link" data-action="sheet" data-v="info">Что входит в каждый вариант</button>`);
}

function slotsBlock() {
  const c = COURIERS[state.courier];
  const days = [...new Set(c.slots.map(s => s[0]))];
  let h = days.map(day => `<div class="day">${day}</div><div class="chips">${c.slots.map((s, i) => s[0] === day ? `<button class="chip ${i === state.slot ? 'sel' : ''}" data-action="slot" data-v="${i}">${s[1]}</button>` : '').join('')}</div>`).join('');
  if (state.courier === 'smart') h += `<div class="note">${ic('info', 16)}<span>У двери — до 10 минут на сверку деталей</span></div>`;
  if (state.courier === 'fast') h += `<div class="note">${ic('info', 16)}<span>Чаще всего приезжает умный курьер — он сверит детали при вас</span></div>`;
  return block('Дата и время', h);
}

/* ---------- экраны ---------- */
function cart() {
  const items = CART.map(i => `<div class="item">
      <div class="thumb">${ic(i.icon, 28)}</div>
      <div><div class="item-name">${i.name}</div><div class="small muted">${i.sku} · 1 шт.</div>
      <div class="row-between" style="margin-top:6px"><span class="ok">${ic('check', 14)} Подходит</span><span class="price">${rub(i.price)}</span></div></div>
    </div>`).join('');
  return {
    head: header('Корзина', '2 товара', { back: false, logo: true }),
    body: `<div class="content">
      ${block('Ваше авто', `<div class="row-between"><div><div class="strong">${CAR.name}, ${CAR.year}</div><div class="small muted">VIN ${CAR.vin}</div></div><span class="ok">${ic('check', 14)} Всё подходит</span></div>`)}
      <section class="block">${items}</section>
      <div class="note" style="padding:0 4px">${ic('info', 16)}<span>При оформлении можно выбрать курьера: побыстрее, умного или красивого</span></div>
      ${block('Сумма', `<div class="sum-row"><span class="muted">Товары (2)</span><span>${rub(TOTAL)}</span></div><div class="sum-row sum-total"><span>Итого</span><span>${rub(TOTAL)}</span></div>`)}
    </div>`,
    bottom: `<button class="btn" data-action="go" data-v="checkout">Перейти к оформлению</button>`,
  };
}

function checkout() {
  let h = block('Способ получения', chips('method', [['courier', 'Курьер'], ['pickup', 'Самовывоз'], ['pvz', 'Пункт выдачи']], state.method, 'seg'));
  if (state.method === 'courier') {
    h += block('Адрес', `<div class="row-between"><div><div class="strong">Москва, ул. Ленина, 10, кв. 25</div><div class="small muted">Подъезд 2, этаж 5</div></div><button class="link">Изменить</button></div>`);
    h += block('Получатель', chips('recipient', [['me', 'Я'], ['other', 'Другой человек']], state.recipient) +
      (state.recipient === 'other' ? `<label class="switch"><input type="checkbox" data-action="gift" ${state.gift ? 'checked' : ''}> Это подарок — в SMS получателю не будет цены</label>` : ''));
    h += courierBlock();
    h += block('Авто для сверки', `<div class="white row-between"><div><div class="strong">${CAR.name}, ${CAR.year}</div><div class="small muted">VIN ${CAR.vin} · из гаража</div></div><button class="link">Изменить</button></div>`, 'Курьер сверит по нему детали');
    h += slotsBlock();
  } else {
    const pvz = state.method === 'pvz';
    h += block(pvz ? 'Пункт выдачи' : 'Магазин', `<div class="white"><div class="strong">${pvz ? 'Пункт выдачи, ул. Ленина, 4' : 'ROSSKO, Профсоюзная ул., 12'}</div><div class="small muted">Готов к выдаче сегодня с 15:00</div></div>
      <div class="note">${ic('info', 16)}<span>Выбор курьера — при курьерской доставке</span></div>`);
  }
  h += block('Оплата', chips('pay', [['card', 'Картой онлайн'], ['cash', 'При получении']], state.pay));
  h += block('Итого', `<div class="sum-row"><span class="muted">Товары (2)</span><span>${rub(TOTAL)}</span></div>
    <div class="sum-row"><span class="muted">Доставка</span><span>Бесплатно</span></div>
    ${state.method === 'courier' ? `<div class="sum-row"><span class="muted">Курьер</span><span>${COURIERS[state.courier].title}, ${slotText()}</span></div>` : ''}
    <div class="sum-row sum-total"><span>К оплате</span><span>${rub(TOTAL)}</span></div>`);
  return {
    head: header('Оформление заказа', 'ROSSKO Розница'),
    body: `<div class="content">${h}</div>`,
    bottom: `<button class="btn" data-action="go" data-v="success">Оформить заказ · ${rub(TOTAL)}</button>`,
  };
}

function success() {
  if (state.method !== 'courier') {
    return {
      head: header('Заказ оформлен', '№ 48 213', { back: false }),
      body: `<div class="content"><div class="hero"><div class="big-check">${ic('check', 32)}</div><h2>Заказ № 48 213 оформлен</h2><div class="muted">Будет готов к выдаче сегодня с 15:00</div></div></div>`,
      bottom: `<button class="btn" data-action="reset">Начать заново</button>`,
    };
  }
  const prep = assigned() === 'smart'
    ? 'Если старые колодки уже сняты, приготовьте их — курьер сравнит их с новыми.'
    : 'Курьер приедет в фирменной форме и вручит заказ в подарочной упаковке.';
  return {
    head: header('Заказ оформлен', '№ 48 213', { back: false }),
    body: `<div class="content">
      <div class="hero"><div class="big-check">${ic('check', 32)}</div><h2>Заказ № 48 213 оформлен</h2><div class="muted">Привезём ${slotText()}</div></div>
      ${block('Доставка', `<div class="kv">
        <div><span class="k">Курьер</span><span class="v">${COURIERS[state.courier].title}</span></div>
        <div><span class="k">Время</span><span class="v">${slotText()}</span></div>
        <div><span class="k">Адрес</span><span class="v">ул. Ленина, 10, кв. 25</span></div>
      </div><button class="link" data-action="sheet" data-v="change">Изменить курьера — до 13:30</button>`)}
      ${block('Что подготовить', `<div>${prep}</div>${state.gift ? '<div class="small muted">Получателю придёт SMS без цены и состава.</div>' : ''}`)}
    </div>`,
    bottom: `<button class="btn" data-action="go" data-v="tracking">Следить за заказом</button>`,
  };
}

function tracking() {
  const a = assigned();
  const steps = [['Оформлен', '13:02', 'done'], ['Собран', '13:20', 'done'], ['Передан курьеру', '13:41', 'done'], ['В пути', 'будет через 20 минут', 'now'], ['Вручён', '', '']];
  const reveal = a === 'smart'
    ? { eyebrow: state.courier === 'fast' ? 'Кто едет' : 'Ваш курьер', title: 'Умный курьер Андрей', text: 'Сверит колодки с вашим Kia Rio по VIN и проверит допуск масла.', icon: 'smart' }
    : { eyebrow: 'Ваш курьер', title: 'Красивый курьер Андрей', text: 'Вручит заказ в подарочной упаковке.', icon: 'gift' };
  return {
    head: header('Заказ № 48 213', 'В пути'),
    body: `<div class="content">
      <div class="reveal"><span class="rcard-ic">${ic(reveal.icon)}</span><div><div class="eyebrow">${reveal.eyebrow}</div><div class="strong" style="font-size:16px">${reveal.title}</div><div class="small muted">${reveal.text}</div></div></div>
      <div class="map"><svg viewBox="0 0 358 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g stroke="#FFFFFF" stroke-width="10" fill="none"><path d="M0 40H358M0 110H358M70 0V150M190 0V150M300 0V150"/></g>
        <path d="M40 110H190V40H300" stroke="#ED2D2F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
        <circle cx="140" cy="110" r="9" fill="#ED2D2F" stroke="#fff" stroke-width="3"/>
        <circle cx="300" cy="40" r="7" fill="#242424" stroke="#fff" stroke-width="3"/>
      </svg></div>
      ${block('Статус', `<ol class="steps">${steps.map(([t, s, c]) => `<li class="step ${c}"><span class="dot">${c === 'done' ? ic('check', 14) : ''}</span><div><div class="step-t">${t}</div>${s ? `<div class="small muted">${s}</div>` : ''}</div></li>`).join('')}</ol>`)}
      ${block('Код получения', `<div class="row-between"><span class="code">4821</span><span class="small muted" style="max-width:150px">Назовите курьеру при получении</span></div>`)}
      <div class="two"><button class="btn ghost">${ic('chat', 18)} Чат</button><button class="btn ghost">${ic('phone', 18)} Позвонить</button></div>
      <div class="note" style="padding:0 4px">${ic('info', 16)}<span>Изменить курьера уже нельзя — заказ у курьера</span></div>
    </div>`,
    bottom: `<button class="btn" data-action="go" data-v="handover">Курьер приехал</button>`,
  };
}

function handover() {
  if (assigned() === 'pretty') {
    return {
      head: header('Курьер у двери', 'Заказ № 48 213'),
      body: `<div class="content">
        <div class="hero"><div class="big-check">${ic('gift', 30)}</div><h2>Заказ вручён</h2><div class="muted">Подарочная упаковка и открытка — внутри</div></div>
        ${block('Код получения', `<div class="code">4821</div>`)}
      </div>`,
      bottom: `<button class="btn" data-action="go" data-v="rating">Оценить доставку</button>`,
    };
  }
  const list = [
    [true, `Сверил колодки с ${CAR.name} по VIN`],
    [true, 'Проверил маркировку производителя'],
    [true, 'Проверил допуск масла: подходит для вашего двигателя'],
    [false, 'Сравнит со старыми колодками, если они уже сняты'],
  ];
  return {
    head: header('Курьер у двери', 'Умный курьер Андрей'),
    body: `<div class="content">
      ${block('Что сделал курьер', `<ul class="check-list">${list.map(([on, t]) => `<li><span class="cdot ${on ? '' : 'off'}">${ic('check', 14)}</span><span class="${on ? '' : 'muted'}">${t}</span></li>`).join('')}</ul>`)}
      ${block('Код получения', `<div class="row-between"><span class="code">4821</span><span class="small muted" style="max-width:150px">Назовите курьеру, чтобы принять заказ</span></div>`)}
      <div class="note" style="padding:0 4px">${ic('info', 16)}<span>Курьер не устанавливает детали — это работа автосервиса</span></div>
    </div>`,
    bottom: `<button class="btn" data-action="go" data-v="rating">Всё подходит — принять</button>
      <button class="btn ghost" data-action="go" data-v="returned">Что-то не подошло — вернуть</button>`,
  };
}

function returned() {
  return {
    head: header('Возврат у двери', 'Заказ № 48 213'),
    body: `<div class="content">
      ${block('Курьер забрал', `<div class="item"><div class="thumb">${ic('part', 28)}</div><div><div class="item-name">Колодки тормозные передние</div><div class="small muted">Не подошли по VIN · ${rub(3290)}</div></div></div>`)}
      ${block('Подходящая замена', `<div class="item"><div class="thumb">${ic('part', 28)}</div><div><div class="item-name">Колодки тормозные передние, для 1.6 MPI</div><div class="small muted">Арт. RK-24129</div>
        <div class="row-between" style="margin-top:6px"><span class="ok">${ic('check', 14)} Подходит для ${CAR.name}</span><span class="price">${rub(3540)}</span></div></div></div>
        <div class="note">${ic('bolt', 16)}<span>Привезём сегодня 18:00–19:00. Деньги за возврат пойдут в зачёт, доплата ${rub(250)}</span></div>`)}
    </div>`,
    bottom: `<button class="btn" data-action="go" data-v="rating">Заказать замену</button>
      <button class="btn ghost" data-action="go" data-v="rating">Вернуть ${rub(3290)} на карту</button>`,
  };
}

function rating() {
  const tags = assigned() === 'smart'
    ? ['Сверил с авто', 'Подсказал, что ещё нужно', 'Объяснил понятно', 'Вовремя', 'Вежливо']
    : ['Красивая подача', 'Аккуратная упаковка', 'Вовремя', 'Вежливо'];
  return {
    head: header('Оценка доставки', 'Заказ № 48 213'),
    body: `<div class="content">
      ${block('Как прошла доставка?', `<div class="stars">${[1, 2, 3, 4, 5].map(n => `<button class="star ${n <= state.rating ? 'on' : ''}" data-action="star" data-v="${n}" aria-label="${n} из 5">${ic('star', 36, true)}</button>`).join('')}</div>`)}
      ${block('Что понравилось', `<div class="chips">${tags.map(t => `<button class="chip tag ${state.tags.includes(t) ? 'sel' : ''}" data-action="tag" data-v="${t}">${t}</button>`).join('')}</div>`)}
      <button class="link" style="padding:0 4px">Пожаловаться на курьера</button>
    </div>`,
    bottom: `<button class="btn" data-action="go" data-v="done" ${state.rating ? '' : 'disabled'}>Отправить</button>`,
  };
}

function done() {
  return {
    head: header('Спасибо!', '', { back: false }),
    body: `<div class="content"><div class="hero"><div class="big-check">${ic('check', 32)}</div><h2>Спасибо за оценку</h2><div class="muted">Она помогает курьерам работать лучше</div></div></div>`,
    bottom: `<button class="btn" data-action="reset">Начать заново</button>`,
  };
}

/* ---------- шиты ---------- */
function sheet() {
  if (state.sheet === 'info') {
    const f = (k, body) => `<div class="fmt"><span class="rcard-ic">${ic(COURIERS[k].icon)}</span><div><div class="strong" style="font-size:16px">${COURIERS[k].title}</div>${body}</div></div>`;
    return `<div class="overlay" data-action="close"><div class="sheet" data-action="noop" role="dialog" aria-label="Кто привезёт заказ">
      <div class="grabber"></div>
      <div class="row-between"><h3>Кто привезёт заказ</h3><button class="icon-btn" style="background:var(--card);color:var(--ink)" data-action="close" aria-label="Закрыть">${ic('close', 18)}</button></div>
      ${f('fast', '<p>Приедет курьер, который успеет к выбранному времени. Чаще всего это умный — он сверит детали с вашим авто. Кто именно едет, покажем в трекинге.</p>')}
      ${f('smart', '<ul><li>Сверит детали с авто по VIN</li><li>Проверит маркировку производителя</li><li>Проверит допуск масла, заряд аккумулятора, дату шин</li><li>Сразу заберёт, если деталь не подошла</li><li>Подскажет, что ещё понадобится для замены</li></ul><p class="muted">Детали не устанавливает — это работа автосервиса.</p>')}
      ${f('pretty', '<ul><li>Фирменная форма</li><li>Аккуратная упаковка</li><li>Вручит как подарок</li></ul><p class="muted">Сверку деталей не делает.</p>')}
      <div class="block"><div class="strong">Как мы подбираем курьеров</div><div class="small">Формат — это роль, а не внешность. Курьеры сами выбирают, в каком формате работать, и проходят обучение. Мы не показываем фото и не даём выбирать курьера по полу или внешности.</div></div>
      <button class="btn" data-action="close">Понятно</button>
    </div></div>`;
  }
  if (state.sheet === 'change') {
    return `<div class="overlay" data-action="close"><div class="sheet" data-action="noop" role="dialog" aria-label="Изменить курьера">
      <div class="grabber"></div>
      <h3>Изменить курьера</h3>
      ${['fast', 'smart', 'pretty'].map(rcard).join('')}
      <button class="btn" data-action="close">Готово</button>
    </div></div>`;
  }
  return '';
}

/* ---------- рендер ---------- */
const VIEWS = { cart, checkout, success, tracking, handover, returned, rating, done };
const $phone = document.getElementById('phone');

function render(resetScroll) {
  const prev = $phone.querySelector('.screen');
  const top = prev && !resetScroll ? prev.scrollTop : 0;
  const v = VIEWS[state.screen]();
  $phone.innerHTML = `${v.head}<main class="screen">${v.body}</main>${v.bottom ? `<div class="bottom">${v.bottom}</div>` : ''}${sheet()}`;
  $phone.querySelector('.screen').scrollTop = top;
  document.getElementById('jump').innerHTML = SCREENS.map(([k, l]) => {
    const cur = k === 'info' ? state.sheet === 'info' : (state.screen === k && state.sheet !== 'info');
    return `<button class="${cur ? 'cur' : ''}" data-action="jump" data-v="${k}">${l}</button>`;
  }).join('');
  document.getElementById('biz').checked = state.business;
  try { history.replaceState(null, '', '#' + state.screen); } catch (e) {}
}

function go(screen) { state.screen = screen; state.sheet = null; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action, v = t.dataset.v;
  let reset = false;
  switch (a) {
    case 'noop': return;
    case 'go': go(v); reset = true; break;
    case 'back': go(BACK[state.screen] || 'cart'); reset = true; break;
    case 'jump':
      if (v === 'info') { if (state.screen !== 'checkout') { go('checkout'); reset = true; } state.method = 'courier'; state.expanded = true; state.sheet = 'info'; }
      else { go(v); reset = true; }
      break;
    case 'method': state.method = v; break;
    case 'recipient': state.recipient = v; if (v === 'me') state.gift = false; break;
    case 'gift': state.gift = t.checked; break;
    case 'courier': state.courier = v; state.slot = 0; break;
    case 'expand': state.expanded = true; break;
    case 'slot': state.slot = +v; break;
    case 'pay': state.pay = v; break;
    case 'sheet': state.sheet = v; break;
    case 'close': state.sheet = null; break;
    case 'star': state.rating = +v; break;
    case 'tag': state.tags = state.tags.includes(v) ? state.tags.filter(x => x !== v) : [...state.tags, v]; break;
    case 'business': state.business = t.checked; state.expanded = false; if (state.business) { state.courier = 'fast'; state.slot = 0; } break;
    case 'reset': state = initial(); reset = true; break;
    default: return;
  }
  render(reset);
});

/* стартовый экран из адреса: #checkout, #tracking … */
const h = location.hash.replace('#', '');
if (VIEWS[h]) state.screen = h;
if (h === 'info') { state.screen = 'checkout'; state.sheet = 'info'; }
render(true);
</script>
</body>
</html>
